services:
  backend:
    build: ./backend
    volumes:
      - pirao-data:/data
    environment:
      PIRAO_RUNS_DIR: /data/runs
      PIRAO_CACHE_DIR: /data/model-cache

  frontend:
    build: ./frontend
    ports:
      # Loopback only: the app has no login, so it should not be reachable
      # from the rest of the network.
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  pirao-data:
