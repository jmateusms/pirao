server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single origin for the app and the API, so the browser needs no CORS and
    # the frontend needs no backend address.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Run progress arrives as server-sent events; buffering would hold the
        # whole stream until the run finished, which defeats the point.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
