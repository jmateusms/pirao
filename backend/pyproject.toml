[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pirao"
version = "0.1.1"
description = "pirão -- Probabilistic Inference for Reliability Analysis from Observed data: pick a likelihood and a prior per parameter, get a fitted Stan model"
# The PyPI page.  It lives here rather than at the repository root because
# the Docker build context is ./backend, where a path escaping the package
# root would not resolve.
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Mateus Santana", email = "jmateussan@gmail.com" }]
keywords = ["reliability", "bayesian", "stan", "mcmc", "censored-data", "weibull", "prior"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "cmdstanpy>=1.2",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    # ArviZ 1.0 reorganised summary() (hdi_prob, stat_focus, column names);
    # results.py is written against 0.x.
    "arviz>=0.17,<1",
    "openpyxl>=3.1",
    # The local interface (`pirao gui`) is the main way in, so its server is
    # part of the base install, as farofa's and faultree's are.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/jmateusms/pirao"
Documentation = "https://github.com/jmateusms/pirao#readme"
Issues = "https://github.com/jmateusms/pirao/issues"

[project.optional-dependencies]
# Kept for existing commands (`pip install -e ".[api]"`); now part of the base.
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
export = ["pyarrow>=15"]
# httpx2 backs starlette's TestClient; without it test_api.py cannot even be
# collected.  Current starlette requires httpx2 specifically and only accepts
# the older httpx with a deprecation warning.
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.9", "httpx2"]

[project.scripts]
pirao = "pirao.cli:main"
# The name before 2026-10-08, kept so old scripts and habits still work.
relimcmc = "pirao.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pirao"]
# The built web app is not in git (`npm run build:package` writes it); it
# ships in the wheel and the sdist so `pirao gui` needs no Node.
artifacts = ["src/pirao/gui_static/**"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/scripts", "/tests", "/README.md", "/pytest.ini"]
artifacts = ["src/pirao/gui_static/**"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Translation catalogues: one entry per line reads better than wrapped prose.
"src/pirao/locales/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
